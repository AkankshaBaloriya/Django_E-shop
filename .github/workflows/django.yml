name: DJANGO-PROD-CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # 1. Build Docker image
      - name: Build Docker image
        run: docker build -t django-app .

      # 2. Run container with name
      - name: Run container
        run: docker run -d -p 8000:8000 --name django-container django-app

      # 3. Wait for container to be ready
      - name: Wait for container
        run: sleep 5

      # 4. Run migrations inside container
      - name: Run migrations
        run: docker exec django-container python manage.py migrate

      # 5. Run tests inside container
      - name: Run tests
        run: docker exec django-container python manage.py test
        
