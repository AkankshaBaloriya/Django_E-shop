name: DJANGO-PROD-CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      #1. checkout code 
      - name: Checkout code 
        uses: actions/checkout@v3

        #2. SETUP PYTHON
      - name: SETUP PYTHON
        uses: actions/setup-python@v4
        with:
          python-version : "3.10"

         # 3. Install dependencies
      - name: INSTALL DEPENDECIES
        run:  |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

       # 4. Run migrations
      - name: RUN migrations
        run:  python manage.py migrate
      #  env:
       #   SECRET_KEY: django-insecure-verylongsecurekey123456
       #   DEBUG: "False"

      # 5. Run tests
      - name: RUN tests
        run: python manage.py test

