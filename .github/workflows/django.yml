name: DJANGO-PROD-CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name : git checkout
        uses: actions/checkout@v3

      - name : SET image tag 
        id : vars
        run : echo " IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV



      - name : BUILD DOCKER IMAGE ON GITHUB RUNNER
        run : docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/django_e-shop:${{ env.IMAGE_TAG }} .

      #- name: Lint Python code
      #  run: |
      #    pip install flake8
      #    flake8 .
    #  - name: Run Django tests
  #      run: |
  #        docker run --rm ${{ secrets.DOCKER_HUB_USERNAME }}/django-app:${{ env.IMAGE_TAG }} python manage.py test

      - name : DOCKERHUB LOGIN 
        uses : docker/login-action@v2
        with:
          username : ${{ secrets.DOCKER_HUB_USERNAME }}
          password : ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name : PUSH DOCKER IAMGE TO DOCKER HUB  
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/django_e-shop:${{ env.IMAGE_TAG }}

      - name : Deploy to server with rollback
        uses: appleboy/ssh-action@v0.1.7
        with: 
          host : ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # Pull new image
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/django-app:${{ env.IMAGE_TAG }}

            # Rename current container as backup if exists
            if [ $(docker ps -q -f name=django-container) ]; then
              docker rename django-container django-container-backup
            fi

            # Run new container
            docker run -d -p 8000:8000 --restart unless-stopped --name django-container ${{ secrets.DOCKER_HUB_USERNAME }}/django-app:${{ env.IMAGE_TAG }}

            # Run migrations, rollback if fail
            if ! docker exec django-container python manage.py migrate; then
              echo "Migration failed, rolling back..."
              docker stop django-container || true
              docker rm django-container || true
              docker rename django-container-backup django-container || true
              docker start django-container || true
              exit 1
            fi

            # Remove backup if everything is fine
            if [ $(docker ps -q -f name=django-container-backup) ]; then
              docker stop django-container-backup || true
              docker rm django-container-backup || true
            fi









